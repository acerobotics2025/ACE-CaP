<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>ACE-CaP: Towards Agentic Intelligence through Experience</title>
<meta name="description" content="ACE-CaP, from ACE Robotics: coding agents that acquire physical skills through experience and keep them as executable programs. Reports, blog and real-robot galleries.">
<meta property="og:title" content="ACE-CaP: Towards Agentic Intelligence through Experience">
<meta property="og:description" content="Reports, blog and real-robot galleries from the ACE-CaP Team, ACE Robotics.">
<meta property="og:image" content="static/posters/hero.jpg">
<link rel="icon" type="image/png" href="static/img/favicon.png">
<link rel="stylesheet" href="static/css/site.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body>

<a class="skip" href="#report">Skip to content</a>

<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="#top" aria-label="ACE-CaP, home"><img src="static/img/logo-dark.png" alt="ACE-CaP" width="688" height="176"></a>
    <nav class="nav-links" aria-label="Sections">
      <a href="#report">Report</a>
      <a href="#blog">Blog</a>
      <a href="#gallery">Gallery</a>
    </nav>
  </div>
</header>

<header class="hero" id="top">
  <video class="hero-media" id="hero-video" poster="static/posters/hero.jpg" muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1"></video>
  <span class="hero-sheet" aria-hidden="true"></span>
  <div class="hero-text">
    <h1 class="hero-title" data-hero="1">Towards Agentic Intelligence<br> through Experience</h1>
    <p class="hero-authors" data-hero="2">ACE-CaP Team</p>
    <p class="hero-affil" data-hero="3"><img src="static/img/ace-robotics.svg" alt="ACE Robotics" width="98" height="37"></p>
  </div>
  <span class="hero-cue" aria-hidden="true"></span>
</header>

<main class="page">

  <section class="section" id="report">
    <div class="wrap">
      <h2 class="section-title">Report</h2>
      <div class="reports" id="reports"></div>
    </div>
  </section>

  <section class="section" id="blog">
    <div class="wrap">
      <h2 class="section-title">Blog</h2>
      <div id="posts"></div>
    </div>
  </section>

  <section class="section" id="gallery">
    <div class="wrap">
      <h2 class="section-title">Gallery</h2>
      <div class="tabs" id="gallery-tabs" role="tablist" aria-label="Galleries by report"></div>
      <div class="cards" id="gallery-cards" role="tabpanel"></div>
      <div class="gallery-foot">
        <p id="gallery-note"></p>
        <button class="quiet-btn" id="gallery-toggle" type="button" aria-pressed="false">Pause videos</button>
      </div>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="wrap">
    <p>ACE-CaP Team, ACE Robotics, 2026. Reported numbers are from the reports. Videos are from the team's real-robot execution records.</p>
  </div>
</footer>

<dialog class="lb" id="lightbox" aria-labelledby="lb-title">
  <div class="lb-head">
    <div>
      <h3 id="lb-title"></h3>
      <p id="lb-desc"></p>
    </div>
    <button class="lb-close" id="lb-close" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="lb-video" id="lb-video"></div>
  <div class="lb-foot">
    <dl class="lb-stats" id="lb-stats"></dl>
    <a class="pill pill-quiet" id="lb-link" href="#">Read the report</a>
    <p class="lb-note" id="lb-note"></p>
  </div>
</dialog>

<script src="static/js/data.js"></script>
<script src="static/js/site-data.js"></script>
<script src="static/js/site.js"></script>
</body>
</html>
